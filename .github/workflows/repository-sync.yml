name: Repository Sync Automation

on:
  schedule:
    # Weekly sync on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      sync_type:
        description: 'Type of sync to perform'
        required: true
        default: 'check-health'
        type: choice
        options:
          - check-health
          - sync-baseline
          - sync-github
          - sync-ballerina
          - full-sync
      force_sync:
        description: 'Force sync even if conflicts detected'
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-permissions:
    name: Check Permissions
    runs-on: ubuntu-latest
    outputs:
      can-sync: ${{ steps.check.outputs.can-sync }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Check cross-repo permissions
        id: check
        run: |
          echo "Checking if token has cross-repository permissions..."
          
          # Test if we can access downstream repositories
          if gh repo view breddin/claude-flow-github >/dev/null 2>&1; then
            echo "✅ Can access claude-flow-github"
            echo "can-sync=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Cannot access claude-flow-github"
            echo "can-sync=false" >> $GITHUB_OUTPUT
            echo "::warning::Limited permissions detected. Cross-repository sync will be disabled."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  determine-repo-type:
    name: Determine Repository Type
    runs-on: ubuntu-latest
    needs: check-permissions
    outputs:
      repo-type: ${{ steps.detect.outputs.repo-type }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Detect repository type
        id: detect
        run: |
          if [[ "${{ github.repository }}" == *"baseline"* ]]; then
            echo "repo-type=baseline" >> $GITHUB_OUTPUT
          elif [[ "${{ github.repository }}" == *"github"* ]]; then
            echo "repo-type=github" >> $GITHUB_OUTPUT
          elif [[ "${{ github.repository }}" == *"ballerina"* ]]; then
            echo "repo-type=ballerina" >> $GITHUB_OUTPUT
          else
            echo "repo-type=unknown" >> $GITHUB_OUTPUT
          fi

  health-check:
    name: Repository Health Check
    runs-on: ubuntu-latest
    needs: [check-permissions, determine-repo-type]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run health check
        run: |
          chmod +x scripts/sync-manager.sh
          ./scripts/sync-manager.sh check-health

  sync-baseline:
    name: Sync Baseline Repository
    runs-on: ubuntu-latest
    needs: [check-permissions, determine-repo-type, health-check]
    if: |
      needs.determine-repo-type.outputs.repo-type == 'baseline' && 
      (github.event.schedule || 
       github.event.inputs.sync_type == 'sync-baseline' || 
       github.event.inputs.sync_type == 'full-sync')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Setup GitHub CLI
        run: |
          gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Setup remotes and sync
        run: |
          chmod +x scripts/sync-manager.sh
          ./scripts/sync-manager.sh setup-remotes
          ./scripts/sync-manager.sh sync-baseline

  sync-github:
    name: Sync GitHub Repository
    runs-on: ubuntu-latest
    needs: [check-permissions, determine-repo-type, health-check]
    if: |
      needs.check-permissions.outputs.can-sync == 'true' &&
      needs.determine-repo-type.outputs.repo-type == 'github' && 
      (github.event.inputs.sync_type == 'sync-github' || 
       github.event.inputs.sync_type == 'full-sync')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Setup GitHub CLI
        run: |
          gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Setup remotes and sync
        run: |
          chmod +x scripts/sync-manager.sh
          ./scripts/sync-manager.sh setup-remotes github
          ./scripts/sync-manager.sh sync-github

  sync-ballerina:
    name: Sync Ballerina Repository
    runs-on: ubuntu-latest
    needs: [check-permissions, determine-repo-type, health-check]
    if: |
      needs.check-permissions.outputs.can-sync == 'true' &&
      needs.determine-repo-type.outputs.repo-type == 'ballerina' && 
      (github.event.inputs.sync_type == 'sync-ballerina' || 
       github.event.inputs.sync_type == 'full-sync')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Setup GitHub CLI
        run: |
          gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Setup remotes and sync
        run: |
          chmod +x scripts/sync-manager.sh
          ./scripts/sync-manager.sh setup-remotes ballerina
          ./scripts/sync-manager.sh sync-ballerina

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [sync-baseline, sync-github, sync-ballerina]
    if: always()
    steps:
      - name: Notify on success
        if: |
          needs.sync-baseline.result == 'success' || 
          needs.sync-github.result == 'success' || 
          needs.sync-ballerina.result == 'success'
        run: |
          echo "✅ Repository sync completed successfully"
          # Add notification logic here (Slack, email, etc.)

      - name: Notify on failure
        if: |
          needs.sync-baseline.result == 'failure' || 
          needs.sync-github.result == 'failure' || 
          needs.sync-ballerina.result == 'failure'
        run: |
          echo "❌ Repository sync failed - manual intervention required"
          # Add notification logic here (Slack, email, etc.)

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [sync-baseline, sync-github, sync-ballerina, notification]
    if: always()
    steps:
      - name: Cleanup temporary resources
        run: |
          echo "🧹 Cleaning up temporary resources"
          # Add cleanup logic if needed
